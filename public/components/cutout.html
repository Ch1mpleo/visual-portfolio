<!doctype html>
<!-- Cutout: an independent interaction study by Ch1mpleo.
     No dependencies. Unsplash demo photos require an internet connection. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cutout — a paper & photography experiment</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --surround: #e7dfcc;
        --mat: #124e37;
        --grid: #a0c39b42;
        --paper: #f3eddf;
        --ink: #24201b;
      }
      body {
        margin: 0;
        background: var(--surround);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible {
        outline: 3px solid #fbcc39;
        outline-offset: 6px;
      }
      .desk {
        position: relative;
        min-height: 100svh;
        padding: 12px;
        overflow: hidden;
      }
      .board {
        position: relative;
        height: calc(100svh - 24px);
        min-height: 300px;
        border-radius: 8px;
        overflow: hidden;
        background-color: var(--mat);
        box-shadow:
          0 5px 18px #0003,
          inset 0 0 30px #0003;
        isolation: isolate;
      }
      .board:before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 1px solid var(--grid);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          linear-gradient(#b9d6ab24 1px, transparent 1px),
          linear-gradient(90deg, #b9d6ab24 1px, transparent 1px);
        background-size:
          24px 24px,
          24px 24px,
          120px 120px,
          120px 120px;
        pointer-events: none;
        z-index: -2;
      }
      .board:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        opacity: 0.2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.23' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
      }
      .leaf-shadow {
        position: absolute;
        inset: -25%;
        transform: rotate(-28deg);
        background: repeating-linear-gradient(
          65deg,
          transparent 0 65px,
          #041e1180 85px,
          transparent 140px
        );
        filter: blur(13px);
        pointer-events: none;
        z-index: -1;
      }
      .ruler {
        position: absolute;
        top: 15px;
        left: 16px;
        right: 16px;
        height: 9px;
        opacity: 0.6;
        background: repeating-linear-gradient(
          90deg,
          #c8d4b8 0 1px,
          transparent 1px 6px
        );
        pointer-events: none;
      }
      .ruler.bottom {
        top: auto;
        bottom: 15px;
      }
      .question {
        position: absolute;
        left: 5%;
        top: 9%;
        margin: 0;
        color: var(--paper);
        font: 11px/1.4 monospace;
        letter-spacing: 0.14em;
      }
      .question strong {
        display: block;
        width: max-content;
        padding: 3px 8px;
        margin: 7px 0;
        background: #231f19;
        color: #f3eddf;
        font:
          900 clamp(20px, 4.2vw, 64px) / 1.1 Arial,
          sans-serif;
        letter-spacing: -0.03em;
        transform: rotate(-2deg);
      }
      .question em {
        display: block;
        width: max-content;
        margin-left: 58%;
        padding: 2px 8px;
        background: #edbc23;
        color: #231f19;
        font:
          italic 900 clamp(20px, 3.6vw, 54px) / 1.1 Arial,
          sans-serif;
        transform: rotate(5deg);
      }
      .prompt {
        position: absolute;
        top: 39%;
        left: 8%;
        color: #e0e5ce;
        font: clamp(8px, 1.3vw, 14px) / 1.5 monospace;
        letter-spacing: 0.13em;
      }
      .prompt span { display: block; font: 32px/1.3 Georgia, serif; transform: rotate(8deg); }
      .mood {
        position: absolute;
        border: 0;
        padding: 0;
        background: none;
        color: var(--ink);
        transform: rotate(var(--angle));
        transition: transform 0.25s;
        z-index: 2;
      }
      .mood .paper {
        position: relative;
        display: block;
        padding: 0.04em 0.14em;
        background: var(--card);
        color: var(--type);
        border-radius: 2px;
        box-shadow: 1px 4px 7px #0003;
        font:
          900 clamp(20px, 6.2vw, 82px) / 1.1 Arial,
          Helvetica,
          sans-serif;
        letter-spacing: -0.035em;
      }
      .mood small {
        display: block;
        margin-top: 9px;
        color: #d3ddc7;
        font: clamp(6px, 0.95vw, 11px) / 1.3 monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .mood:hover { transform: translateY(-7px) rotate(var(--angle)); }
      .mood:hover .paper {
        outline: 1px dashed #eee8d4;
        outline-offset: 7px;
        box-shadow: 3px 14px 15px #0005;
      }
      .mood:hover .paper:after {
        content: '';
        position: absolute;
        inset: -12px;
        background:
          linear-gradient(#eee8d4 0 0) 0 0 / 6px 6px,
          linear-gradient(#eee8d4 0 0) 100% 0 / 6px 6px,
          linear-gradient(#eee8d4 0 0) 0 100% / 6px 6px,
          linear-gradient(#eee8d4 0 0) 100% 100% / 6px 6px;
        background-repeat: no-repeat;
        pointer-events: none;
      }
      .mood[data-mood='bold'] {
        left: 68%;
        top: 12%;
        --angle: -6deg;
        --card: #e54126;
        --type: #fff0da;
      }
      .mood[data-mood='soft'] {
        left: 8%;
        top: 58%;
        --angle: 4deg;
        --card: #eae0cc;
        --type: #30271d;
      }
      .mood[data-mood='raw'] {
        left: 54%;
        top: 57%;
        --angle: -4deg;
        --card: #1e201c;
        --type: #f6f0df;
      }
      .mood[data-mood='dreamy'] {
        left: 68%;
        top: 39%;
        --angle: 4deg;
        --card: #bcc8e3;
        --type: #202b4b;
      }
      .mood[data-mood='dreamy'] .paper {
        font-size: clamp(17px, 4.5vw, 63px);
      }
      .mood[data-mood='cinematic'] {
        left: 30%;
        top: 80%;
        --angle: -3deg;
        --card: #edbc23;
        --type: #30271d;
      }
      .mood[data-mood='cinematic'] .paper {
        font-size: clamp(20px, 4.8vw, 65px);
      }
      .camera { position: absolute; width: clamp(45px, 9vw, 110px); aspect-ratio: 1.7; left: 43%; top: 3%; border: 3px solid #d9d4c3; border-radius: 6px; background: linear-gradient(#c9c9bd 0 28%, #272c27 28% 86%, #b8b9ae 86%); transform: rotate(-8deg); box-shadow: 2px 4px 5px #0005; }
      .camera:before { content: ''; position: absolute; width: 45%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #b5b38d 0 4%, #14202a 9% 24%, #080f10 25% 40%, #7c8079 42% 47%, #202a26 49% 61%, #b5b4a4 63%); top: 20%; left: 32%; }
      .camera:after { content: ''; position: absolute; width: 20%; height: 13%; background: #26322d; top: 8%; right: 8%; }
      .film { position: absolute; width: 28px; height: 43px; left: 7%; bottom: 6%; border: 2px solid #d6cfc0; border-radius: 8px 8px 5px 5px; background: linear-gradient(90deg, #181a18 0 25%, #d7a22f 25% 80%, #191c1a 80%); transform: rotate(-20deg); box-shadow: 3px 4px 5px #0004; }
      .coffee {
        position: absolute;
        width: 85px;
        height: 85px;
        border: 5px solid #8a714342;
        border-radius: 50%;
        bottom: 15%;
        right: 15%;
        transform: scaleY(0.92);
        pointer-events: none;
      }
      .scissors {
        position: absolute;
        width: 72px;
        height: 48px;
        z-index: 12;
        pointer-events: none;
        filter: drop-shadow(2px 4px 3px #0008);
        transform-origin: 10% 50%;
      }
      .scissors:before {
        content: '';
        position: absolute;
        width: 220px;
        right: 63px;
        top: 24px;
        border-top: 2px dashed #f5eedc;
      }
      .scissors[hidden],
      [hidden] {
        display: none !important;
      }
      .sheet {
        position: absolute;
        inset: 6%;
        z-index: 7;
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding: clamp(16px, 3vw, 40px);
        background: var(--paper);
        color: #24201b;
        box-shadow: 3px 15px 40px #0005;
      }
      .sheet header {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #aaa394;
        padding-bottom: 10px;
        font: 10px/1.4 monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .sheet button {
        color: #24201b;
      }
      .back {
        background: none;
        border: 0;
        padding: 8px;
        font: 11px monospace;
      }
      .project {
        display: grid;
        flex: 1;
        min-height: 100px;
        grid-template-columns: 1.3fr 1fr;
        align-items: stretch;
        gap: 6%;
        margin: 18px 0;
      }
      .project > div {
        align-self: center;
      }
      .hero-image {
        width: 100%;
        height: 100%;
        min-height: 100px;
        object-fit: cover;
        background: #b4aa91;
      }
      .project h1 {
        font-size: clamp(22px, 4.5vw, 60px);
        line-height: 0.95;
        letter-spacing: -0.06em;
        margin: 8px 0 15px;
      }
      .project p {
        font: 11px/1.6 monospace;
      }
      .project .stock {
        font-size: 9px;
        color: #746b59;
      }
      .strip { display: grid; flex-shrink: 0; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; border-top: 1px solid #aaa394; padding: 14px 4px 4px; overflow-x: auto; }
      .strip button { border: 0; background: none; padding: 3px; min-width: 0; }
      .strip button[aria-pressed='true'] { outline: 2px solid #b53d26; outline-offset: 1px; }
      .strip img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #c2b39b; }
      .strip small { font: 9px monospace; }
      .sheet footer { flex-shrink: 0; margin-top: 12px; font: 9px/1.4 monospace; display: flex; justify-content: space-between; gap: 12px; }
      .sheet a { color: inherit; }
      .source-letter {
        display: inline-block;
      }
      .card-mask {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: drop-shadow(1px 2px 1px #0006);
        pointer-events: none;
      }
      .mood.is-cut .paper {
        background: transparent;
        box-shadow: none;
        outline: 0;
      }
      .mood.is-cut .paper:after {
        display: none;
      }
      .letter-piece,
      .photo-transfer {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        pointer-events: none;
        transform-origin: 0 0;
        will-change: transform, opacity;
      }
      .letter-piece {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.035em;
        filter: drop-shadow(3px 7px 5px #0005);
      }
      .letter-glyph,
      .letter-solid,
      .letter-veil {
        position: absolute;
        inset: 0;
        white-space: pre;
      }
      .letter-glyph {
        background-size: cover;
        background-position: center;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .letter-solid {
        color: var(--card);
      }
      .letter-veil {
        color: #96d5c4;
        opacity: 0;
      }
      .photo-face,
      .photo-transfer img {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo-face {
        opacity: 0;
        clip-path: inset(45% 35%);
      }
      .board:not([data-phase='idle']) .mood:not(.is-chosen),
      .board:not([data-phase='idle']) .question,
      .board:not([data-phase='idle']) .prompt {
        opacity: 0;
        pointer-events: none;
      }
      .question,
      .prompt,
      .mood {
        transition:
          opacity 0.3s ease,
          transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .board:not([data-phase='idle']) .mood {
        pointer-events: none;
      }
      .board:not([data-phase='idle']) .mood:hover { transform: rotate(var(--angle)); }
      .board-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 34px;
        height: 42px;
        pointer-events: none;
        z-index: 30;
        filter: drop-shadow(2px 3px 2px #0007);
      }
      @media (hover: hover) and (pointer: fine) {
        .board.has-cursor,
        .board.has-cursor * {
          cursor: none !important;
        }
      }
      @media (max-aspect-ratio: 4/5) {
        .prompt span { display: none; }
        .question {
          top: 9%;
          left: 8%;
        }
        .question strong {
          font-size: 7vw;
        }
        .question em {
          font-size: 7vw;
        }
        .camera {
          top: 4%;
          left: 70%;
          width: clamp(45px, 12vw, 90px);
        }
        .prompt {
          top: 31%;
          left: 10%;
          font-size: 9px;
        }
        .mood .paper {
          font-size: 12vw;
        }
        .mood small {
          font-size: 7px;
        }
        .mood[data-mood='bold'] {
          left: 52%;
          top: 40%;
        }
        .mood[data-mood='soft'] {
          left: 12%;
          top: 47%;
        }
        .mood[data-mood='raw'] {
          left: 57%;
          top: 58%;
        }
        .mood[data-mood='dreamy'] {
          left: 12%;
          top: 69%;
        }
        .mood[data-mood='dreamy'] .paper {
          font-size: 8vw;
        }
        .mood[data-mood='cinematic'] {
          left: 14%;
          top: 84%;
        }
        .mood[data-mood='cinematic'] .paper {
          font-size: 9vw;
        }
        .sheet {
          inset: 4%;
        }
        .project {
          min-height: 230px;
          grid-template-columns: 1fr;
          grid-template-rows: minmax(100px, 1fr) auto;
          gap: 10px;
        }
        .project h1 {
          margin: 5px 0;
        }
        .project p {
          margin: 7px 0;
        }
        .strip {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="desk" aria-label="Cutout interactive cutting mat">
      <div class="board" data-phase="idle">
        <div class="leaf-shadow"></div>
        <div class="ruler"></div>
        <div class="ruler bottom"></div>
        <p class="question">
          HOW SHOULD
          <strong>YOUR PHOTOS</strong>
          <em>feel?</em>
        </p>
        <p class="prompt">
          PICK ONE — THE CUT DOES THE REST
          <span aria-hidden="true">⤷</span>
        </p>
        <div class="camera" aria-hidden="true"></div>
        <div class="film" aria-hidden="true"></div>
        
        
        <div class="coffee" aria-hidden="true"></div>
        <button class="mood" data-mood="bold">
          <span class="paper">BOLD</span>
          <small>Colour that argues</small>
        </button>
        <button class="mood" data-mood="soft">
          <span class="paper">SOFT</span>
          <small>One window. No flash.</small>
        </button>
        <button class="mood" data-mood="raw">
          <span class="paper">RAW</span>
          <small>Push it two stops</small>
        </button>
        <button class="mood" data-mood="dreamy">
          <span class="paper">DREAMY</span>
          <small>Shoot it through glass</small>
        </button>
        <button class="mood" data-mood="cinematic">
          <span class="paper">CINEMATIC</span>
          <small>One lamp, one window</small>
        </button>
        <span class="scissors" aria-hidden="true" hidden>
          <svg viewBox="0 0 90 60" fill="none">
            <path
              d="m28 24 52-17-31 27 31 17-52-15"
              fill="#dce1db"
              stroke="#23332b"
              stroke-width="2"
            />
            <path
              d="m29 29 47-19M29 30l47 19"
              stroke="#faf7e6"
              stroke-width="2"
            />
            <circle cx="27" cy="30" r="4" fill="#5e6d61" />
            <ellipse
              cx="15"
              cy="18"
              rx="11"
              ry="8"
              transform="rotate(25 15 18)"
              stroke="#f0e9d7"
              stroke-width="5"
            />
            <ellipse
              cx="15"
              cy="42"
              rx="11"
              ry="8"
              transform="rotate(-25 15 42)"
              stroke="#f0e9d7"
              stroke-width="5"
            />
          </svg>
        </span>
        <section class="sheet" aria-labelledby="sheet-title" hidden>
          <header>
            <span id="sheet-mood">BOLD / CONTACT SHEET</span>
            <button class="back" type="button">← Back to the mat</button>
          </header>
          <div class="project">
            <img class="hero-image" alt="" />
            <div>
              <p class="stock">A STUDY IN FEELING / 35MM</p>
              <h1 id="sheet-title">
                Colour outside
                <br />
                the lines.
              </h1>
              <p id="project-description"></p>
              <p class="stock">
                UNSPLASH / SELECTED FRAMES
                <span class="counter">01 / 06</span>
              </p>
            </div>
          </div>
          <div
            class="strip"
            role="group"
            aria-label="Contact sheet photographs"
          ></div>
          <footer><span>Hover, tap, or use ← → to explore.</span><a href="https://unsplash.com" target="_blank" rel="noopener noreferrer">Photos: Unsplash ↗</a></footer>
        </section>
        <span
          class="status"
          role="status"
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
          "
        ></span>
        <svg class="board-cursor" aria-hidden="true" viewBox="0 0 34 42" hidden>
          <path
            d="M4 3v29l8-7 5 12 6-3-5-11h10Z"
            fill="#fff8e8"
            stroke="#181d17"
            stroke-width="2.4"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </main>
    <script>
      ;(() => {
        const $ = (selector) => document.querySelector(selector)
        const board = $('.board'),
          sheet = $('.sheet'),
          scissors = $('.scissors')
        const reduced = matchMedia('(prefers-reduced-motion: reduce)')
        const ease = 'cubic-bezier(.16,1,.3,1)'
        const photos = [
          [
            'photo-1470252649378-9c29740c9fa8',
            'Morning light over a quiet landscape',
          ],
          ['photo-1464822759023-fed622ff2c3b', 'Clouds around a mountain peak'],
          ['photo-1472396961693-142e6e269027', 'Deer in a sunlit woodland'],
          [
            'photo-1519681393784-d120267933ba',
            'A mountain beneath a sky of stars',
          ],
          [
            'photo-1441974231531-c6227db76b6e',
            'Sunlight falling through a forest',
          ],
          [
            'photo-1500534623283-312aade485b7',
            'An open landscape in evening light',
          ],
          ['photo-1518837695005-2083093ee35b', 'Waves meeting the shore'],
          ['photo-1447752875215-b2761acb3c5d', 'A path through the woodland'],
          [
            'photo-1501785888041-af3ef285b470',
            'Mountains reflected in a still lake',
          ],
          [
            'photo-1470770841072-f978cf4d019e',
            'A small cabin beside a mountain lake',
          ],
        ]
        const moods = {
          bold: {
            title: 'Colour outside\nthe lines.',
            text: 'More colour. Less permission. A collection of moments that refuse to whisper.',
            filter: 'saturate(1.6) contrast(1.12)',
          },
          soft: {
            title: 'Let the light\ncome to you.',
            text: 'Quiet frames, open windows, and the gentlest part of the afternoon.',
            filter: 'saturate(.65) contrast(.85) brightness(1.1)',
          },
          raw: {
            title: 'Nothing\nto hide.',
            text: 'Texture, shadow, and a little beautiful imperfection. Just as it happened.',
            filter: 'grayscale(1) contrast(1.25)',
          },
          dreamy: {
            title: 'Somewhere\nin between.',
            text: 'Half a memory, half a daydream. The world through a softer kind of glass.',
            filter: 'saturate(.7) sepia(.2) hue-rotate(315deg)',
          },
          cinematic: {
            title: 'Stay for\none more frame.',
            text: 'A small story in ten frames. Every shadow has somewhere to lead you.',
            filter: 'sepia(.35) saturate(.8) contrast(1.2)',
          },
        }
        const photoUrl = (id, width = 700) =>
          `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=80`
        const animations = new Set()
        let chosen = null,
          active = 0,
          filter = '',
          run = 0,
          rollReady = null
        function phase(value) {
          board.dataset.phase = value
          board.setAttribute(
            'aria-busy',
            String(!['idle', 'open'].includes(value)),
          )
        }
        function animate(el, frames, duration, delay = 0, easing = ease) {
          const final = frames[frames.length - 1]
          if (reduced.matches) {
            Object.entries(final).forEach(([key, value]) => {
              if (!['offset', 'easing'].includes(key)) el.style[key] = value
            })
            return Promise.resolve()
          }
          const animation = el.animate(frames, {
            duration,
            delay,
            easing,
            fill: 'both',
          })
          animations.add(animation)
          return animation.finished
            .then(() => {
              Object.entries(final).forEach(([key, value]) => {
                if (!['offset', 'easing'].includes(key)) el.style[key] = value
              })
              animation.cancel()
            })
            .catch(() => {})
            .finally(() => animations.delete(animation))
        }
        const transform = (x, y, sx = 1, sy = sx, angle = 0) =>
          `translate3d(${x}px,${y}px,0) rotate(${angle}deg) scale(${sx},${sy})`
        const local = (el) => {
          const r = el.getBoundingClientRect(),
            b = board.getBoundingClientRect()
          return {
            x: r.left - b.left,
            y: r.top - b.top,
            w: r.width,
            h: r.height,
          }
        }
        function ensureRoll() {
          if (!rollReady) {
            const images = photos.map(([id]) => {
              const img = new Image()
              img.src = photoUrl(id)
              return img.decode()
            })
            let timeout
            rollReady = Promise.race([
              Promise.allSettled(images),
              new Promise((resolve) => {
                timeout = setTimeout(resolve, 5000)
              }),
            ]).finally(() => clearTimeout(timeout))
          }
          return rollReady
        }
        const cells = photos.map(([id, alt], i) => {
          const button = document.createElement('button')
          button.type = 'button'
          button.setAttribute('aria-label', `View photograph ${i + 1}: ${alt}`)
          const img = document.createElement('img')
          img.src = photoUrl(id, 160)
          img.alt = ''
          img.loading = 'lazy'
          const label = document.createElement('small')
          label.textContent = String(i + 1).padStart(2, '0')
          button.append(img, label)
          $('.strip').append(button)
          button.addEventListener('pointermove', (e) => {
            if (
              e.pointerType === 'mouse' &&
              board.dataset.phase === 'open' &&
              i !== active
            )
              select(i)
          })
          button.addEventListener('click', () => select(i))
          button.addEventListener('focus', () => select(i))
          button.addEventListener('keydown', (e) => {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key))
              return
            e.preventDefault()
            const next =
              e.key === 'Home'
                ? 0
                : e.key === 'End'
                  ? photos.length - 1
                  : (active +
                      (e.key === 'ArrowRight' ? 1 : photos.length - 1)) %
                    photos.length
            cells[next].focus()
          })
          return button
        })
        function select(i) {
          active = i
          const [id, alt] = photos[i],
            hero = $('.hero-image')
          hero.src = photoUrl(id, 1000)
          hero.srcset = `${photoUrl(id, 480)} 480w, ${photoUrl(id, 1000)} 1000w`
          hero.sizes = '(max-aspect-ratio:4/5) 80vw, 45vw'
          hero.alt = alt
          hero.style.filter = filter
          cells.forEach((button, j) => {
            button.setAttribute('aria-pressed', String(i === j))
            button.querySelector('img').style.filter = filter
          })
          $('.counter').textContent =
            `${String(i + 1).padStart(2, '0')} / ${photos.length}`
        }
        function prepareWord() {
          const paper = chosen.querySelector('.paper'),
            word = chosen.dataset.mood.toUpperCase()
          paper.replaceChildren(
            ...[...word].map((char) => {
              const span = document.createElement('span')
              span.className = 'source-letter'
              span.textContent = char
              return span
            }),
          )
          const style = getComputedStyle(paper),
            font = parseFloat(style.fontSize),
            h = paper.offsetHeight
          const spans = [...paper.querySelectorAll('.source-letter')]
          const sources = spans.map((span) => ({
            el: span,
            ...local(span),
            font,
            left: span.offsetLeft,
            width: span.offsetWidth,
          }))
          const svg = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'svg',
          )
          svg.classList.add('card-mask')
          svg.setAttribute('viewBox', `0 0 ${paper.offsetWidth} ${h}`)
          svg.innerHTML = `<defs><mask id="paper-holes"><rect width="100%" height="100%" fill="white"/>${sources.map((s, i) => `<text data-hole="${i}" x="${s.left}" y="${h / 2}" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="${font}" font-weight="900" textLength="${s.width}" lengthAdjust="spacingAndGlyphs" fill="black" opacity="0">${word[i]}</text>`).join('')}</mask></defs><rect width="100%" height="100%" rx="2" fill="${style.backgroundColor}" mask="url(#paper-holes)"/>`
          paper.append(svg)
          chosen.classList.add('is-cut')
          return sources
        }
        function makePieces(sources) {
          const word = chosen.dataset.mood.toUpperCase(),
            ctx = document.createElement('canvas').getContext('2d')
          ctx.font = '900 100px Arial'
          const advances = [...word].map(
            (c) => ctx.measureText(c).width / 100 - 0.025,
          )
          const font = Math.min(
            board.clientHeight * 0.36,
            (board.clientWidth * 0.82) / advances.reduce((a, b) => a + b, 0),
          )
          const total = advances.reduce((a, b) => a + b, 0) * font
          let x = (board.clientWidth - total) / 2
          return [...word].map((char, i) => {
            const w = advances[i] * font,
              h = font * 1.1,
              el = document.createElement('div')
            el.className = 'letter-piece'
            el.style.cssText = `width:${w}px;height:${h}px;font-size:${font}px;--card:${getComputedStyle(chosen).getPropertyValue('--card')};opacity:0`
            const glyph = document.createElement('span')
            glyph.className = 'letter-glyph'
            glyph.textContent = char
            glyph.style.backgroundImage = `url("${photoUrl(photos[i][0])}")`
            glyph.style.filter = filter
            const solid = document.createElement('span')
            solid.className = 'letter-solid'
            solid.textContent = char
            const veil = document.createElement('span')
            veil.className = 'letter-veil'
            veil.textContent = char
            const face = document.createElement('img')
            face.className = 'photo-face'
            face.src = photoUrl(photos[i][0])
            face.alt = ''
            face.style.filter = filter
            el.append(glyph, solid, veil, face)
            board.append(el)
            const source = sources[i],
              scale = source.font / font
            const p = {
              el,
              glyph,
              solid,
              veil,
              face,
              w,
              h,
              source,
              home: transform(
                source.x,
                source.y,
                scale,
                scale,
                parseFloat(
                  getComputedStyle(chosen).getPropertyValue('--angle'),
                ),
              ),
              center: transform(x, board.clientHeight * 0.48 - h / 2),
            }
            x += w
            return p
          })
        }
        async function heroFlight(reverse, duration) {
          const hero = $('.hero-image'),
            from = local(reverse ? hero : cells[active].querySelector('img')),
            to = local(reverse ? cells[active].querySelector('img') : hero)
          const flyer = document.createElement('div')
          flyer.className = 'photo-transfer'
          flyer.style.cssText = `width:${to.w}px;height:${to.h}px`
          const img = document.createElement('img')
          img.src = hero.currentSrc || hero.src
          img.alt = ''
          img.style.filter = filter
          flyer.append(img)
          board.append(flyer)
          hero.style.opacity = '0'
          await animate(
            flyer,
            [
              {
                transform: transform(
                  from.x,
                  from.y,
                  from.w / to.w,
                  from.h / to.h,
                ),
                opacity: 1,
              },
              { transform: transform(to.x, to.y), opacity: 1 },
            ],
            duration,
          )
          flyer.remove()
          if (!reverse) hero.style.opacity = '1'
        }
        async function openSheet(button) {
          if (board.dataset.phase !== 'idle') return
          const token = ++run
          chosen = button
          chosen.style.transform = getComputedStyle(chosen).transform
          chosen.classList.add('is-chosen')
          phase('cutting')
          filter = moods[chosen.dataset.mood].filter
          document
            .querySelectorAll('.mood')
            .forEach((el) => (el.disabled = true))
          const ready = ensureRoll(),
            sources = prepareWord(),
            pieces = makePieces(sources),
            paper = chosen.querySelector('.paper'),
            card = local(paper)
          $('.status').textContent = `Cutting ${chosen.dataset.mood}.`
          scissors.hidden = false
          scissors.style.left = `${card.x - 28}px`
          scissors.style.top = `${card.y + card.h / 2 - 24}px`
          const cut = animate(
            scissors,
            [
              { transform: 'translateX(0)', opacity: 1 },
              { transform: `translateX(${card.w + 35}px)`, opacity: 1 },
            ],
            680,
            0,
            'linear',
          )
          const arrivals = pieces.map((p, i) => {
            const delay =
              (680 * (p.source.left + p.source.width * 0.35)) /
              paper.offsetWidth
            animate(p.source.el, [{ opacity: 1 }, { opacity: 0 }], 1, delay)
            animate(
              paper.querySelector(`[data-hole="${i}"]`),
              [{ opacity: 0 }, { opacity: 1 }],
              1,
              delay,
            )
            return animate(p.el, [
              { transform: p.home, opacity: 0 },
              { transform: p.home, opacity: 1, offset: .001 },
              { transform: p.center, opacity: 1 },
            ], 850, delay, 'cubic-bezier(.18,1.12,.32,1)')
          })
          await cut
          if (token !== run) return
          scissors.hidden = true
          await Promise.all([...arrivals, ready])
          if (token !== run) return
          phase('developing')
          await Promise.all(
            pieces.flatMap((p, i) => [
              animate(p.solid, [{ opacity: 1 }, { opacity: 0 }], 440, i * 65),
              animate(
                p.veil,
                [
                  { opacity: 0 },
                  { opacity: 0.65, offset: 0.3 },
                  { opacity: 0 },
                ],
                520,
                i * 65,
              ),
            ]),
          )
          if (token !== run) return
          phase('developed')
          await animate(pieces[0].el, [{ opacity: 1 }, { opacity: 1 }], 320)
          if (token !== run) return
          // The same image remains attached to its letter through every handoff.
          const data = moods[chosen.dataset.mood]
          $('#sheet-mood').textContent =
            `${chosen.dataset.mood.toUpperCase()} / CONTACT SHEET`
          $('#sheet-title').innerText = data.title
          $('#project-description').textContent = data.text
          select(0)
          sheet.hidden = false
          sheet.inert = true
          sheet.scrollTop = 0
          sheet.style.opacity = '0'
          const parts = [sheet.querySelector('header'), $('.project'), sheet.querySelector('footer')]
          parts.forEach((el) => (el.style.opacity = '0'))
          $('.hero-image').style.opacity = '0'
          cells.forEach((el) => (el.style.opacity = '0'))
          const destinations = pieces.map((p, i) =>
            local(cells[i].querySelector('img')),
          )
          phase('unpacking')
          await Promise.all([
            animate(
              sheet,
              [
                { opacity: 0, transform: 'translateY(18px)' },
                { opacity: 1, transform: 'translateY(0)' },
              ],
              400,
            ),
            ...pieces.map(async (p, i) => {
              const dest = destinations[i],
                delay = i * 45
              await Promise.all([
                animate(
                  p.el,
                  [
                    { transform: p.center, opacity: 1 },
                    {
                      transform: transform(
                        dest.x,
                        dest.y,
                        dest.w / p.w,
                        dest.h / p.h,
                      ),
                      opacity: 1,
                    },
                  ],
                  650,
                  delay,
                ),
                animate(
                  p.face,
                  [
                    { opacity: 0, clipPath: 'inset(45% 35%)' },
                    { opacity: 1, clipPath: 'inset(0%)' },
                  ],
                  480,
                  delay,
                ),
                animate(
                  p.glyph,
                  [{ opacity: 1 }, { opacity: 0 }],
                  400,
                  delay + 100,
                ),
              ])
              if (token !== run) return
              cells[i].style.opacity = '1'
              p.el.remove()
            }),
          ])
          if (token !== run) return
          await Promise.all(
            cells.slice(pieces.length).map((cell, i) =>
              animate(
                cell,
                [
                  { opacity: 0, transform: 'translateY(12px)' },
                  { opacity: 1, transform: 'translateY(0)' },
                ],
                220,
                i * 25,
              ),
            ),
          )
          if (token !== run) return
          phase('opening')
          await Promise.all([
            heroFlight(false, 480),
            ...parts.map((el) =>
              animate(el, [{ opacity: 0 }, { opacity: 1 }], 350),
            ),
          ])
          if (token !== run) return
          sheet.inert = false
          phase('open')
          $('.back').focus({ preventScroll: true })
          $('.status').textContent =
            `${chosen.dataset.mood} contact sheet ready.`
        }
        async function closeSheet() {
          if (board.dataset.phase !== 'open') return
          const token = ++run
          phase('closing')
          sheet.inert = true
          const parts = [sheet.querySelector('header'), $('.project'), sheet.querySelector('footer')]
          await Promise.all([
            heroFlight(true, 230),
            ...parts.map((el) =>
              animate(el, [{ opacity: 1 }, { opacity: 0 }], 180),
            ),
          ])
          if (token !== run) return
          const sources = [...chosen.querySelectorAll('.source-letter')].map(
            (el) => ({
              el,
              ...local(el),
              font: parseFloat(
                getComputedStyle(chosen.querySelector('.paper')).fontSize,
              ),
            }),
          )
          const pieces = makePieces(sources),
            starts = pieces.map((p, i) => local(cells[i].querySelector('img')))
          phase('reforming')
          await Promise.all([
            animate(sheet, [{ opacity: 1 }, { opacity: 0 }], 260),
            ...pieces.map((p, i) => {
              const from = starts[i]
              cells[i].style.opacity = '0'
              p.solid.style.opacity = '0'
              p.face.style.opacity = '1'
              p.face.style.clipPath = 'inset(0%)'
              p.glyph.style.opacity = '0'
              return Promise.all([
                animate(
                  p.el,
                  [
                    {
                      transform: transform(
                        from.x,
                        from.y,
                        from.w / p.w,
                        from.h / p.h,
                      ),
                      opacity: 1,
                    },
                    { transform: p.center, opacity: 1 },
                  ],
                  360,
                  i * 22,
                ),
                animate(
                  p.face,
                  [
                    { opacity: 1, clipPath: 'inset(0%)' },
                    { opacity: 0, clipPath: 'inset(45% 35%)' },
                  ],
                  300,
                  i * 22,
                ),
                animate(p.glyph, [{ opacity: 0 }, { opacity: 1 }], 250, i * 22),
              ])
            }),
          ])
          if (token !== run) return
          sheet.hidden = true
          phase('returning')
          await Promise.all(
            pieces.map(async (p, i) => {
              await Promise.all([
                animate(
                  p.el,
                  [
                    { transform: p.center, opacity: 1 },
                    { transform: p.home, opacity: 1, offset: 0.92 },
                    { transform: p.home, opacity: 0 },
                  ],
                  400,
                  i * 28,
                ),
                animate(p.solid, [{ opacity: 0 }, { opacity: 1 }], 300, i * 28),
              ])
              if (token !== run) return
              p.source.el.style.opacity = '1'
              chosen.querySelector(`[data-hole="${i}"]`).style.opacity = '0'
              p.el.remove()
            }),
          )
          if (token !== run) return
          reset()
        }
        function reset(focus = true) {
          run++
          animations.forEach((a) => a.cancel())
          animations.clear()
          board
            .querySelectorAll('.letter-piece,.photo-transfer')
            .forEach((el) => el.remove())
          scissors.hidden = true
          sheet.hidden = true
          sheet.inert = false
          sheet.removeAttribute('style')
          ;[
            sheet.querySelector('header'),
            $('.project'),
            sheet.querySelector('footer'),
            $('.hero-image'),
            ...cells,
          ].forEach((el) => {
            el.style.opacity = ''
            el.style.transform = ''
          })
          if (chosen) {
            chosen.querySelector('.paper').textContent =
              chosen.dataset.mood.toUpperCase()
            chosen.classList.remove('is-chosen', 'is-cut')
            chosen.style.transform = ''
          }
          document
            .querySelectorAll('.mood')
            .forEach((el) => (el.disabled = false))
          phase('idle')
          if (focus) chosen?.focus({ preventScroll: true })
        }
        document.querySelectorAll('.mood').forEach((button) => {
          button.addEventListener('click', () => openSheet(button))
          button.addEventListener('pointerenter', ensureRoll, { once: true })
          button.addEventListener('focus', ensureRoll, { once: true })
        })
        $('.back').addEventListener('click', closeSheet)
        board.addEventListener('click', (e) => {
          if (
            board.dataset.phase === 'open' &&
            !e.target.closest('.sheet,.mood')
          )
            closeSheet()
        })
        reduced.addEventListener('change', () => {
          if (reduced.matches) animations.forEach((a) => a.finish())
        })
        addEventListener('keydown', (e) => {
          if (e.key !== 'Escape') return
          if (board.dataset.phase === 'open') closeSheet()
          else if (board.dataset.phase !== 'idle') reset()
          else if (parent !== window)
            parent.postMessage({ type: 'component-escape' }, location.origin)
          e.preventDefault()
        })
        let size = `${board.clientWidth}:${board.clientHeight}`
        new ResizeObserver(() => {
          const next = `${board.clientWidth}:${board.clientHeight}`
          if (next !== size && !['idle', 'open'].includes(board.dataset.phase))
            reset(false)
          size = next
        }).observe(board)
        // The pointer is drawn only on fine-pointer devices, with no permanent render loop.
        const cursor = $('.board-cursor')
        let cursorFrame = 0,
          pointerX = 0,
          pointerY = 0
        board.addEventListener(
          'pointermove',
          (e) => {
            if (
              e.pointerType !== 'mouse' ||
              !matchMedia('(hover:hover) and (pointer:fine)').matches
            )
              return
            pointerX = e.clientX
            pointerY = e.clientY
            board.classList.add('has-cursor')
            cursor.removeAttribute('hidden')
            if (!cursorFrame)
              cursorFrame = requestAnimationFrame(() => {
                cursor.style.transform = transform(pointerX - 3, pointerY - 3)
                cursorFrame = 0
              })
          },
          { passive: true },
        )
        board.addEventListener('pointerleave', () => {
          cursor.setAttribute('hidden', '')
          board.classList.remove('has-cursor')
          cancelAnimationFrame(cursorFrame)
          cursorFrame = 0
        })
      })()
    </script>
  </body>
</html>
