<!doctype html>
<!-- Cutout: an independent interaction study by Ch1mpleo.
     No dependencies. Unsplash demo photos require an internet connection. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cutout — a paper & photography experiment</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --surround: #e7dfcc;
        --mat: #0d3427;
        --grid: #a0c39b29;
        --paper: #f3eddf;
        --ink: #24201b;
      }
      body {
        margin: 0;
        background: var(--surround);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible {
        outline: 3px solid #fbcc39;
        outline-offset: 6px;
      }
      .desk {
        position: relative;
        min-height: 100svh;
        padding: 12px;
        overflow: hidden;
      }
      .board {
        position: relative;
        height: calc(100svh - 24px);
        min-height: 300px;
        border-radius: 8px;
        overflow: hidden;
        background-color: var(--mat);
        box-shadow:
          0 5px 18px #0003,
          inset 0 0 30px #0003;
        isolation: isolate;
      }
      .board:before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 1px solid var(--grid);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          linear-gradient(#b9d6ab16 1px, transparent 1px),
          linear-gradient(90deg, #b9d6ab16 1px, transparent 1px);
        background-size:
          24px 24px,
          24px 24px,
          120px 120px,
          120px 120px;
        pointer-events: none;
        z-index: -2;
      }
      .board:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        opacity: 0.11;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.23' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
      }
      .leaf-shadow {
        position: absolute;
        inset: -25%;
        transform: rotate(-28deg);
        background: repeating-linear-gradient(
          65deg,
          transparent 0 65px,
          #041e1180 85px,
          transparent 140px
        );
        filter: blur(13px);
        opacity: 0.55;
        pointer-events: none;
        z-index: -1;
      }
      .ruler {
        position: absolute;
        top: 15px;
        left: 16px;
        right: 16px;
        height: 9px;
        opacity: 0.36;
        background: repeating-linear-gradient(
          90deg,
          #c8d4b8 0 1px,
          transparent 1px 6px
        );
        pointer-events: none;
      }
      .ruler.bottom {
        top: auto;
        bottom: 15px;
      }
      .question {
        position: absolute;
        left: 5%;
        top: 9%;
        margin: 0;
        color: var(--paper);
        font: 11px/1.4 monospace;
        letter-spacing: 0.14em;
      }
      .question strong {
        display: block;
        width: max-content;
        padding: 3px 8px;
        margin: 7px 0;
        background: #231f19;
        color: #f3eddf;
        font:
          900 clamp(20px, 4.2vw, 64px) / 1.1 Arial,
          sans-serif;
        letter-spacing: -0.03em;
        transform: rotate(-2deg);
      }
      .question em {
        display: block;
        width: max-content;
        margin-left: 58%;
        padding: 2px 8px;
        background: #edbc23;
        color: #231f19;
        font:
          italic 900 clamp(20px, 3.6vw, 54px) / 1.1 Arial,
          sans-serif;
        transform: rotate(5deg);
      }
      .prompt {
        position: absolute;
        top: 39%;
        left: 8%;
        color: #e0e5ce;
        font: clamp(8px, 1.3vw, 14px) / 1.5 monospace;
        letter-spacing: 0.13em;
      }
      .prompt-arrow {
        display: block;
        width: clamp(150px, min(26vw, 38vh), 300px);
        height: auto;
        margin: 8px 0 0 -5px;
        overflow: visible;
        color: #f0ebd9;
        pointer-events: none;
      }
      .prompt-arrow path {
        fill: none;
        stroke: currentColor;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .prompt-arrow .marker-pass { stroke-width: 2; opacity: .3; }
      .mood {
        position: absolute;
        border: 0;
        padding: 0;
        background: none;
        color: var(--ink);
        transform: translate3d(var(--drag-x, 0px), var(--drag-y, 0px), 0)
          rotate(var(--angle));
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.25s;
        z-index: 2;
      }
      .mood .paper {
        position: relative;
        display: block;
        padding: 0.04em 0.14em;
        background: var(--card);
        color: var(--type);
        border-radius: 2px;
        box-shadow: 1px 4px 7px #0003;
        font:
          900 clamp(20px, 6.2vw, 82px) / 1.1 Arial,
          Helvetica,
          sans-serif;
        letter-spacing: -0.035em;
      }
      .mood small {
        display: block;
        margin-top: 9px;
        color: #d3ddc7;
        font: clamp(6px, 0.95vw, 11px) / 1.3 monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .mood:hover {
        transform: translate3d(
            var(--drag-x, 0px),
            calc(var(--drag-y, 0px) - 7px),
            0
          )
          rotate(var(--angle));
      }
      .mood:hover .paper {
        box-shadow: 3px 14px 15px #0005;
      }
      .selection-outline {
        position: absolute;
        inset: -10px;
        width: calc(100% + 20px);
        height: calc(var(--paper-height, 100%) + 20px);
        overflow: visible;
        pointer-events: none;
        opacity: 0;
      }
      .selection-outline rect {
        fill: none;
        stroke: #eee8d4;
        stroke-width: 2;
        stroke-dasharray: 7 6;
        vector-effect: non-scaling-stroke;
      }
      .mood:hover .selection-outline,
      .mood:focus-visible .selection-outline {
        opacity: 1;
      }
      .mood:hover .selection-outline rect,
      .mood:focus-visible .selection-outline rect {
        animation: march-ants 0.65s linear infinite;
      }
      .board:not([data-phase='idle']) .selection-outline {
        display: none;
      }
      @keyframes march-ants {
        to {
          stroke-dashoffset: -26;
        }
      }
      .mood:hover .paper:after {
        content: '';
        position: absolute;
        inset: -12px;
        background:
          linear-gradient(#eee8d4 0 0) 0 0 / 6px 6px,
          linear-gradient(#eee8d4 0 0) 100% 0 / 6px 6px,
          linear-gradient(#eee8d4 0 0) 0 100% / 6px 6px,
          linear-gradient(#eee8d4 0 0) 100% 100% / 6px 6px;
        background-repeat: no-repeat;
        pointer-events: none;
      }
      .mood[data-mood='bold'] {
        left: 68%;
        top: 12%;
        --angle: -6deg;
        --card: #e54126;
        --type: #fff0da;
      }
      .mood[data-mood='soft'] {
        left: 8%;
        top: 58%;
        --angle: 4deg;
        --card: #eae0cc;
        --type: #30271d;
      }
      .mood[data-mood='raw'] {
        left: 54%;
        top: 57%;
        --angle: -4deg;
        --card: #1e201c;
        --type: #f6f0df;
      }
      .mood[data-mood='dreamy'] {
        left: 68%;
        top: 39%;
        --angle: 4deg;
        --card: #bcc8e3;
        --type: #202b4b;
      }
      .mood[data-mood='dreamy'] .paper {
        font-size: clamp(17px, 4.5vw, 63px);
      }
      .mood[data-mood='cinematic'] {
        left: 30%;
        top: 80%;
        --angle: -3deg;
        --card: #edbc23;
        --type: #30271d;
      }
      .mood[data-mood='cinematic'] .paper {
        font-size: clamp(20px, 4.8vw, 65px);
      }
      .desk-sticker {
        position: absolute;
        z-index: 1;
        pointer-events: none;
        user-select: none;
        opacity: 0.65;
        filter: brightness(0.86) saturate(0.75) drop-shadow(2px 5px 3px #0006);
      }
      .desk-sticker img {
        display: block;
        width: 100%;
        height: auto;
      }
      .camera {
        width: clamp(70px, 12vw, 160px);
        left: 38%;
        top: 2%;
        transform: rotate(-11deg);
      }
      .film {
        width: clamp(50px, 7vw, 100px);
        left: 3%;
        bottom: 3%;
        transform: rotate(-24deg);
      }
      .lens {
        width: clamp(55px, 8vw, 105px);
        right: 2%;
        bottom: 3%;
        transform: rotate(15deg);
      }
      .prints {
        width: clamp(40px, 4.5vw, 64px);
        left: 3%;
        top: 45%;
        transform: rotate(-10deg);
      }
      .prints img {
        padding: 4px 4px 12px;
        background: #f3edda;
        aspect-ratio: 0.85;
        object-fit: cover;
        filter: sepia(0.15) saturate(0.7) contrast(0.92);
      }
      .prints img + img {
        position: absolute;
        top: 12px;
        left: 13px;
        transform: rotate(17deg);
      }
      .coffee {
        position: absolute;
        width: 85px;
        height: 85px;
        border: 5px solid #8a71432b;
        border-radius: 50%;
        bottom: 15%;
        right: 15%;
        transform: scaleY(0.92);
        pointer-events: none;
      }
      .scissors {
        position: absolute;
        width: 72px;
        height: 48px;
        z-index: 12;
        pointer-events: none;
        filter: drop-shadow(2px 4px 3px #0008);
        transform-origin: 10% 50%;
      }
      .scissors:before {
        content: '';
        position: absolute;
        width: 220px;
        right: 63px;
        top: 24px;
        border-top: 2px dashed #f5eedc;
      }
      .scissors[hidden],
      [hidden] {
        display: none !important;
      }
      .sheet {
        position: absolute;
        inset: 6%;
        z-index: 7;
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding: clamp(16px, 3vw, 40px);
        background: var(--paper);
        color: #24201b;
        box-shadow: 3px 15px 40px #0005;
      }
      .sheet header {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #aaa394;
        padding-bottom: 10px;
        font: 10px/1.4 monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .sheet button {
        color: #24201b;
      }
      .back {
        background: none;
        border: 0;
        padding: 8px;
        font: 11px monospace;
      }
      .project {
        display: grid;
        flex: 1;
        min-height: 100px;
        grid-template-columns: 1.3fr 1fr;
        align-items: stretch;
        gap: 6%;
        margin: 18px 0;
      }
      .project > div {
        align-self: center;
      }
      .hero-image {
        width: 100%;
        height: 100%;
        min-height: 100px;
        object-fit: cover;
        background: #b4aa91;
      }
      .project h1 {
        font-size: clamp(22px, 4.5vw, 60px);
        line-height: 0.95;
        letter-spacing: -0.06em;
        margin: 8px 0 15px;
      }
      .project p {
        font: 11px/1.6 monospace;
      }
      .project .stock {
        font-size: 9px;
        color: #746b59;
      }
      .strip {
        display: grid;
        flex-shrink: 0;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 9px;
        padding: 8px 2px 2px;
        overflow: visible;
      }
      .strip button {
        position: relative;
        border: 0;
        background: none;
        padding: 0;
        min-width: 0;
        text-align: left;
      }
      .strip button:focus-visible {
        outline: 2px solid #925b3e;
        outline-offset: 5px;
      }
      .strip-photo {
        position: relative;
        display: block;
      }
      .strip img {
        display: block;
        width: 100%;
        aspect-ratio: 1.5;
        border: 2px solid #28251e;
        object-fit: cover;
        background: #c2b39b;
        box-shadow: 1px 2px 5px #0006;
        transition: box-shadow 0.2s ease;
      }
      .strip button:is(:hover, :focus-visible) img {
        box-shadow:
          0 0 0 2px #a65f38,
          0 0 0 3px #f2debf,
          3px 6px 10px #24170b88;
      }
      .strip small {
        display: block;
        margin-top: 5px;
        color: #898477;
        font: 11px/1 monospace;
      }
      .strip button[aria-pressed='true'] small {
        color: #332d23;
      }
      .keeper-mark {
        position: absolute;
        inset: -5px -6px;
        width: calc(100% + 12px);
        height: calc(100% + 10px);
        overflow: visible;
        pointer-events: none;
        transform: rotate(-7deg);
      }
      .keeper-mark path {
        fill: none;
        stroke: #985f42;
        stroke-width: 1.4;
        opacity: 0.9;
        vector-effect: non-scaling-stroke;
      }
      .strip button:nth-child(5) .keeper-mark {
        transform: rotate(8deg);
      }
      .source-letter {
        display: inline-block;
      }
      .card-mask {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: drop-shadow(1px 2px 1px #0006);
        pointer-events: none;
      }
      .mood.is-cut .paper {
        background: transparent;
        box-shadow: none;
        outline: 0;
      }
      .mood.is-cut .paper:after {
        display: none;
      }
      .letter-piece,
      .photo-transfer {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        pointer-events: none;
        transform-origin: 0 0;
        will-change: transform, opacity;
      }
      .letter-piece {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.035em;
        filter: drop-shadow(3px 7px 5px #0005);
      }
      .letter-glyph,
      .letter-solid,
      .letter-veil {
        position: absolute;
        inset: 0;
        white-space: pre;
      }
      .letter-glyph {
        background-size: cover;
        background-position: center;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .letter-solid {
        color: var(--card);
      }
      .letter-veil {
        color: #96d5c4;
        opacity: 0;
      }
      .photo-face,
      .photo-transfer img {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo-face {
        opacity: 0;
        clip-path: inset(45% 35%);
      }
      .board:not([data-phase='idle']) .mood:not(.is-chosen),
      .board:not([data-phase='idle']) .question,
      .board:not([data-phase='idle']) .prompt {
        opacity: 0;
        pointer-events: none;
      }
      .question,
      .prompt,
      .mood {
        transition:
          opacity 0.3s ease,
          transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .board:not([data-phase='idle']) .mood {
        pointer-events: none;
      }
      .board:not([data-phase='idle']) .mood:hover,
      .board.is-arranging .mood:hover {
        transform: translate3d(var(--drag-x, 0px), var(--drag-y, 0px), 0)
          rotate(var(--angle));
      }
      .board.is-arranging .mood {
        transition: opacity 0.3s ease;
      }
      .mood.is-dragging {
        z-index: 4;
      }
      .mood.is-dragging .paper {
        box-shadow: 4px 16px 18px #0006;
      }

      .board-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 34px;
        height: 42px;
        pointer-events: none;
        z-index: 30;
        filter: drop-shadow(2px 3px 2px #0007);
      }
      @media (hover: hover) and (pointer: fine) {
        .board.has-cursor,
        .board.has-cursor * {
          cursor: none !important;
        }
      }
      @media (max-aspect-ratio: 4/5) {
        .prints {
          display: none;
        }
        .question {
          top: 9%;
          left: 8%;
        }
        .question strong {
          font-size: 7vw;
        }
        .question em {
          font-size: 7vw;
        }
        .camera {
          top: 4%;
          left: 70%;
          width: clamp(45px, 12vw, 90px);
        }
        .prompt {
          top: 31%;
          left: 10%;
          font-size: 9px;
        }
        .mood .paper {
          font-size: 12vw;
        }
        .mood small {
          font-size: 7px;
        }
        .mood[data-mood='bold'] {
          left: 52%;
          top: 40%;
        }
        .mood[data-mood='soft'] {
          left: 12%;
          top: 47%;
        }
        .mood[data-mood='raw'] {
          left: 57%;
          top: 58%;
        }
        .mood[data-mood='dreamy'] {
          left: 12%;
          top: 69%;
        }
        .mood[data-mood='dreamy'] .paper {
          font-size: 8vw;
        }
        .mood[data-mood='cinematic'] {
          left: 14%;
          top: 84%;
        }
        .mood[data-mood='cinematic'] .paper {
          font-size: 9vw;
        }
        .sheet {
          inset: 4%;
        }
        .project {
          min-height: 230px;
          grid-template-columns: 1fr;
          grid-template-rows: minmax(100px, 1fr) auto;
          gap: 10px;
        }
        .project h1 {
          margin: 5px 0;
        }
        .project p {
          margin: 7px 0;
        }
        .strip {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="desk" aria-label="Cutout interactive cutting mat">
      <div class="board" data-phase="idle">
        <div class="leaf-shadow"></div>
        <div class="ruler"></div>
        <div class="ruler bottom"></div>
        <p class="question">
          HOW SHOULD
          <strong>YOUR PHOTOS</strong>
          <em>feel?</em>
        </p>
        <p class="prompt">
          PICK ONE — THE CUT DOES THE REST
          <svg class="prompt-arrow" viewBox="0 0 320 110" aria-hidden="true">
            <path d="M17 16C43 43 78 61 117 67C171 76 229 70 288 52" />
            <path d="M239 29C255 35 276 44 295 49C280 61 265 76 253 92" />
            <path class="marker-pass" d="M19 22C49 48 82 64 122 70C180 79 237 69 288 55M243 33L291 51L256 89" />
          </svg>
        </p>
        <div class="desk-sticker camera" aria-hidden="true">

              }
              if (blocked(slot)) {
                slot.x = oldX
                slot.y = oldY
              }
            }
            apply(slot)
          }
          function stop() {
            cancelAnimationFrame(raf)
            raf = 0
            moving = null
            if (drag?.slot.el.hasPointerCapture(drag.id))
              drag.slot.el.releasePointerCapture(drag.id)
            drag = null
            elements.forEach((el) => el.classList.remove('is-dragging'))
            board.classList.remove('is-arranging')
          }
          function tick(time) {
            raf = 0
            if (!moving || board.dataset.phase !== 'idle') {
              stop()
              return
            }
            const dt = lastTime
              ? Math.min((time - lastTime) / 1000, 0.032)
              : 1 / 60
            lastTime = time
            const { slot, x, y } = moving,
              beforeX = slot.x,
              beforeY = slot.y
            const factor = reduced.matches ? 1 : 1 - Math.exp(-28 * dt)
            move(slot, (x - slot.x) * factor, (y - slot.y) * factor)
            const remaining = Math.hypot(x - slot.x, y - slot.y),
              travelled = Math.hypot(slot.x - beforeX, slot.y - beforeY)
            if (remaining > 0.15 && travelled > 0.015)
              raf = requestAnimationFrame(tick)
            else if (!drag) {
              moving = null
              board.classList.remove('is-arranging')
            }
          }
          function wake() {
            if (!raf) {
              lastTime = 0
              raf = requestAnimationFrame(tick)
            }
          }
          function measure() {
            stop()
            board.classList.add('is-arranging')
            elements.forEach((el) => {
              el.style.removeProperty('--drag-x')
              el.style.removeProperty('--drag-y')
            })
            slots = elements.map((el) => {
              const angle =
                (parseFloat(getComputedStyle(el).getPropertyValue('--angle')) *
                  Math.PI) /
                180
              const hw = el.offsetWidth / 2,
                hh = el.offsetHeight / 2
              el.style.setProperty(
                '--paper-height',
                `${el.querySelector('.paper').offsetHeight}px`,
              )
              const baseX = el.offsetLeft + hw,
                baseY = el.offsetTop + hh
              return {
                el,
                hw,
                hh,
                cos: Math.cos(angle),
                sin: Math.sin(angle),
                baseX,
                baseY,
                x: baseX,
                y: baseY,
              }
            })
            const placed = []
            for (const slot of slots) {
              contain(slot)
              if (placed.some((other) => collision(slot, other))) {
                const originalX = slot.x,
                  originalY = slot.y
                let best = null,
                  distance = Infinity
                for (let y = inset; y < board.clientHeight - inset; y += 12)
                  for (let x = inset; x < board.clientWidth - inset; x += 12) {
                    slot.x = x
                    slot.y = y
                    contain(slot)
                    const d =
                      (slot.x - originalX) ** 2 + (slot.y - originalY) ** 2
                    if (
                      d < distance &&
                      !placed.some((other) => collision(slot, other))
                    ) {
                      best = { x: slot.x, y: slot.y }
                      distance = d
                    }
                  }
                if (best) {
                  slot.x = best.x
                  slot.y = best.y
                } else {
                  slot.x = originalX
                  slot.y = originalY
                }
              }
              placed.push(slot)
              apply(slot)
            }
            void board.offsetWidth
            board.classList.remove('is-arranging')
          }
          function finish(event, cancelled = false) {
            if (!drag || event.pointerId !== drag.id) return
            const current = drag
            drag = null
            if (current.didDrag) {
              suppressed.set(current.slot.el, performance.now() + 350)
              if (cancelled) {
                current.slot.x = current.startX
                current.slot.y = current.startY
                apply(current.slot)
                void current.slot.el.offsetWidth
                moving = null
              }
              $('.status').textContent =
                `${current.slot.el.dataset.mood} card placed.`
            }
            current.slot.el.classList.remove('is-dragging')
            if (current.slot.el.hasPointerCapture(event.pointerId))
              current.slot.el.releasePointerCapture(event.pointerId)
            if (!moving || cancelled || !raf) {
              moving = null
              cancelAnimationFrame(raf)
              raf = 0
              board.classList.remove('is-arranging')
            }
            // Captured touch pointers do not synthesize click consistently across browsers.
            if (
              !current.didDrag &&
              !cancelled &&
              event.pointerType === 'touch'
            ) {
              suppressed.set(current.slot.el, performance.now() + 350)
              current.slot.el.click()
            }
          }
          for (const el of elements) {
            el.setAttribute(
              'aria-description',
              'Drag to rearrange. Click to explore. Shift and arrow keys move this card.',
            )
            el.addEventListener('pointerdown', (event) => {
              if (
                event.button !== 0 ||
                !event.isPrimary ||
                board.dataset.phase !== 'idle'
              )
                return
              stop()
              const slot = slots.find((item) => item.el === el)
              drag = {
                id: event.pointerId,
                slot,
                pointerX: event.clientX,
                pointerY: event.clientY,
                startX: slot.x,
                startY: slot.y,
                didDrag: false,
              }
              el.setPointerCapture(event.pointerId)
            })
            el.addEventListener(
              'pointermove',
              (event) => {
                if (!drag || drag.id !== event.pointerId) return
                const dx = event.clientX - drag.pointerX,
                  dy = event.clientY - drag.pointerY
                if (!drag.didDrag && Math.hypot(dx, dy) < 6) return
                drag.didDrag = true
                board.classList.add('is-arranging')
                el.classList.add('is-dragging')
                const goal = {
                  ...drag.slot,
                  x: drag.startX + dx,
                  y: drag.startY + dy,
                }
                contain(goal)
                moving = { slot: drag.slot, x: goal.x, y: goal.y }
                wake()
              },
              { passive: true },
            )
            el.addEventListener('pointerup', (event) => finish(event))
            el.addEventListener('pointercancel', (event) => finish(event, true))
            el.addEventListener('lostpointercapture', (event) =>
              finish(event, true),
            )
            el.addEventListener('keydown', (event) => {
              if (
                !event.shiftKey ||
                !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(
                  event.key,
                ) ||
                board.dataset.phase !== 'idle'
              )
                return
              event.preventDefault()
              stop()
              const slot = slots.find((item) => item.el === el)
              board.classList.add('is-arranging')
              move(
                slot,
                event.key === 'ArrowLeft'
                  ? -12
                  : event.key === 'ArrowRight'
                    ? 12
                    : 0,
                event.key === 'ArrowUp'
                  ? -12
                  : event.key === 'ArrowDown'
                    ? 12
                    : 0,
              )
              void el.offsetWidth
              board.classList.remove('is-arranging')
            })
            el.addEventListener(
              'click',
              (event) => {
                if (
                  event.detail > 0 &&
                  performance.now() < (suppressed.get(el) || 0)
                ) {
                  event.preventDefault()
                  event.stopImmediatePropagation()
                }
              },
              true,
            )
          }
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) stop()
          })
          measure()
          return {
            stop,
            measure,
            cancel: () => {
              if (!drag) return false
              finish({ pointerId: drag.id }, true)
              return true
            },
          }
        }
        const arrangement = createArrangement()
        document.querySelectorAll('.mood').forEach((button) => {
          button.addEventListener('click', () => openSheet(button))
          button.addEventListener('pointerenter', ensureRoll, { once: true })
          button.addEventListener('focus', ensureRoll, { once: true })
        })
        $('.back').addEventListener('click', closeSheet)
        board.addEventListener('click', (e) => {
          if (
            board.dataset.phase === 'open' &&
            !e.target.closest('.sheet,.mood')
          )
            closeSheet()
        })
        reduced.addEventListener('change', () => {
          if (reduced.matches) animations.forEach((a) => a.finish())
        })
        addEventListener('keydown', (e) => {
          if (e.key !== 'Escape') return
          if (arrangement.cancel()) {
            e.preventDefault()
            return
          }
          if (board.dataset.phase === 'open') closeSheet()
          else if (board.dataset.phase !== 'idle') reset()
          else if (parent !== window)
            parent.postMessage({ type: 'component-escape' }, location.origin)
          e.preventDefault()
        })
        let size = `${board.clientWidth}:${board.clientHeight}`
        new ResizeObserver(() => {
          const next = `${board.clientWidth}:${board.clientHeight}`
          if (next !== size && !['idle', 'open'].includes(board.dataset.phase))
            reset(false)
          if (next !== size) {
            if (chosen) chosen.style.transform = ''
            arrangement.measure()
          }
          size = next
        }).observe(board)
        // The pointer is drawn only on fine-pointer devices, with no permanent render loop.
        const cursor = $('.board-cursor')
        let cursorFrame = 0,
          pointerX = 0,
          pointerY = 0
        board.addEventListener(
          'pointermove',
          (e) => {
            if (
              e.pointerType !== 'mouse' ||
              !matchMedia('(hover:hover) and (pointer:fine)').matches
            )
              return
            pointerX = e.clientX
            pointerY = e.clientY
            board.classList.add('has-cursor')
            cursor.removeAttribute('hidden')
            if (!cursorFrame)
              cursorFrame = requestAnimationFrame(() => {
                cursor.style.transform = transform(pointerX - 3, pointerY - 3)
                cursorFrame = 0
              })
          },
          { passive: true },
        )
        board.addEventListener('pointerleave', () => {
          cursor.setAttribute('hidden', '')
          board.classList.remove('has-cursor')
          cancelAnimationFrame(cursorFrame)
          cursorFrame = 0
        })
      })()
    </script>
  </body>
</html>
