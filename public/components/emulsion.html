<!doctype html>
<!-- Emulsion: an independent interaction study by Ch1mpleo.
     No dependencies. Steam photographs require an internet connection. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emulsion — video game photography by Ch1mpleo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --wall: #eee7da;
        --ink: #29251f;
        --muted: #71695e;
        --red: #c84e30;
      }
      body {
        margin: 0;
        background: var(--wall);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }
      button {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      .scene:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 5px;
      }
      .scene {
        position: relative;
        height: 100svh;
        min-height: 300px;
        overflow: hidden;
        isolation: isolate;
      }
      .scene:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        opacity: 0.1;
        filter: grayscale(1);
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23808080' filter='url(%23n)' d='M0 0h150v150H0z'/%3E%3C/svg%3E");
      }
      .topbar {
        position: absolute;
        inset: 22px 26px auto;
        z-index: 9;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        font: 9px/1.4 monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .topbar button {
        background: none;
        border: 0;
        color: inherit;
        padding: 6px;
        font: inherit;
      }
      .topbar nav {
        display: flex;
        gap: 16px;
      }
      .topbar button[aria-current='true'] {
        text-decoration: underline;
        text-underline-offset: 5px;
      }
      .headline {
        position: absolute;
        left: 0;
        top: 46%;
        margin: 0;
        color: var(--red);
        font:
          400 clamp(170px, 43vw, 700px) / 0.8 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.075em;
        white-space: nowrap;
        pointer-events: none;
        transform-origin: 0 0;
      }
      .headline--worlds {
        top: 28%;
        font-size: clamp(140px, 36vw, 650px);
      }
      .intro {
        position: absolute;
        top: 23%;
        left: 4.5%;
        width: 32%;
        z-index: 2;
      }
      .eyebrow {
        margin: 0 0 14px;
        color: var(--muted);
        font: 10px / 1.5 Arial, sans-serif;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .intro h1 {
        margin: 0;
        font: 400 clamp(23px, 2.7vw, 44px) / 1.08 Georgia, serif;
        letter-spacing: -0.035em;
      }
      .intro hr {
        width: 63%;
        margin: 22px 0 0;
        border: 0;
        border-top: 1px solid var(--muted);
      }
      .gallery-copy {
        position: absolute;
        left: 5.5%;
        bottom: 5.5%;
        width: 33%;
        z-index: 2;
      }
      .gallery-copy .eyebrow { color: var(--red); margin-bottom: 12px; }
      .gallery-copy h2 {
        margin: 0;
        font: 500 clamp(14px, 1.7vw, 28px) / 1.15 Arial, sans-serif;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .print {
        --pin-size: clamp(6px, 0.55vw, 9px);
        position: absolute;
        top: var(--y);
        left: var(--x);
        width: var(--w);
        padding: clamp(2px, 0.25vw, 4px);
        border: 0;
        background: #faf5e8;
        box-shadow: 3px 8px 14px #2f291b2d;
        transform: rotate(var(--angle));
        transform-origin: var(--pin) calc(1px + var(--pin-size) / 2);
        touch-action: none;
        cursor: grab;
        user-select: none;
        z-index: 3;
      }
      .print:before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 1px;
        left: var(--pin);
        width: var(--pin-size);
        height: var(--pin-size);
        transform: translateX(-50%);
        border: 1px solid #e8ddc8;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 25%,
          #fffdf6 8%,
          #b0a793 30%,
          #6f6657 65%,
          #332f28
        );
        z-index: 1;
        box-shadow: 0 0 0 1px #39312888, 1px 2px 3px #0007;
      }
      .print__image {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: var(--image-ratio, 16 / 9);
        overflow: hidden;
      }
      .print img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #b6a58f;
        pointer-events: none;
      }
      .print--portrait img {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 177.777778%;
        height: 56.25%;
        transform: translate(-50%, -50%) rotate(-90deg);
      }
      .print__caption {
        position: absolute;
        inset: auto 0 0;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 22px 8px 8px;
        color: #fff;
        background: linear-gradient(transparent, #0009);
        font: 400 clamp(9px, 0.8vw, 12px) / 1.35 Arial, sans-serif;
        text-align: left;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }
      .print__logo {
        flex: 0 0 auto;
        width: 19px;
        height: 24px;
        background: #fff;
        mask: var(--logo) center / contain no-repeat;
        -webkit-mask: var(--logo) center / contain no-repeat;
      }
      .print__game { min-width: 0; }
      .print:hover .print__caption,
      .print:focus-visible .print__caption {
        opacity: 1;
        transform: translateY(0);
      }
      @media (max-width: 600px), (max-height: 600px) {
        .print__caption { padding: 12px 4px 4px; gap: 4px; font-size: 8px; }
        .print__logo { width: 12px; height: 17px; }
      }
      .print:hover,
      .print:focus-visible {
        box-shadow: 6px 18px 24px #2f291b40;
        z-index: 6;
      }
      .print.dragging {
        cursor: grabbing;
        z-index: 7;
      }
      .contact {
        position: absolute;
        top: 18%;
        left: var(--contact-x, 260%);
        width: 65%;
        height: 65%;
        background: var(--red);
        color: #f9edda;
        padding: clamp(12px, 3vmin, 48px);
        z-index: 4;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 6px;
      }
      .contact h2 {
        font:
          400 clamp(28px, min(7vw, 12svh), 100px) / 0.95 Georgia,
          serif;
        letter-spacing: -0.05em;
        margin: 0;
      }
      .contact p {
        font: 10px/1.6 monospace;
        max-width: 35ch;
        margin: 0;
      }
      .contact button {
        align-self: flex-start;
        background: none;
        border: 0;
        border-bottom: 1px solid currentColor;
        padding: 8px 0;
        color: inherit;
        font: 10px monospace;
      }
      @media (max-aspect-ratio: 4/5) {
        .topbar {
          inset: 20px 18px auto;
        }
        .topbar nav {
          gap: 6px;
        }
        .topbar button {
          font-size: 8px;
        }
        .intro {
          top: 15%;
          left: 6%;
          width: 87%;
        }
        .intro h1 {
          font-size: clamp(23px, 7.5vw, 34px);
        }
        .headline {
          top: 60%;
          font-size: 64vw;
        }
        .headline--worlds { top: 39%; font-size: 36vw; }
        .gallery-copy { left: 6%; bottom: 5%; width: 85%; }
        .gallery-copy .eyebrow { font-size: 8px; margin-bottom: 8px; }
        .gallery-copy h2 { font-size: clamp(14px, 4vw, 20px); }
        .contact {
          width: 80%;
          left: var(--contact-x, 260%);
          top: 20%;
          height: 60%;
        }
        .contact h2 {
          font-size: min(13vw, 12svh);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>

            const delta = (e.clientY - p.lastY) * 0.45,
              elapsed = Math.max((e.timeStamp - p.lastTime) / 1000, 0.008)
            p.angle = clamp(p.angle + delta, p.rest - 32, p.rest + 32)
            p.velocity = clamp(delta / elapsed, -250, 250)
            p.lastY = e.clientY
            p.lastTime = e.timeStamp
            wake()
          })
          const release = (e) => {
            if (!p.dragging) return
            p.dragging = false
            p.el.classList.remove('dragging')
            if (e.timeStamp - p.lastTime > 100) p.velocity = 0
            wake()
          }
          p.el.addEventListener('pointerup', release)
          p.el.addEventListener('pointercancel', release)
          p.el.addEventListener('lostpointercapture', release)
          p.el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault()
              if (!reduced.matches) {
                p.velocity = 85
                wake()
              }
            }
          })
        })
        document
          .querySelectorAll('[data-go]')
          .forEach((el) =>
            el.addEventListener('click', () =>
              setProgress(Number(el.dataset.go)),
            ),
          )
        scene.addEventListener(
          'wheel',
          (e) => {
            const delta =
              Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
            if ((target <= 0 && delta < 0) || (target >= 1 && delta > 0)) return
            e.preventDefault()
            const pixels =
              delta *
              (e.deltaMode === 1
                ? 16
                : e.deltaMode === 2
                  ? height
                  : 1)
            // Preserve total travel regardless of how a wheel/trackpad batches events.
            setProgress(target + pixels / travel)
          },
          { passive: false },
        )
        function layout() {
          width = scene.clientWidth
          height = scene.clientHeight
          const headlineWidth = headline.scrollWidth, worldsWidth = worlds.scrollWidth
          const narrow = width / height <= 0.8
          const padding = Math.min(4, Math.max(2, width * 0.0025))
          function place(p, x, centerY, desiredWidth, maxHeight) {
            p.width = Math.min(desiredWidth, (maxHeight - 2 * padding) * p.ratio + 2 * padding)
            const frameHeight = (p.width - 2 * padding) / p.ratio + 2 * padding
            p.x = x
            p.y = Math.max(54, Math.min(centerY - frameHeight / 2, height * 0.78 - frameHeight))
            p.el.style.setProperty('--x', `${p.x}px`)
            p.el.style.setProperty('--y', `${p.y}px`)
            p.el.style.setProperty('--w', `${p.width}px`)
          }
          openingFrames.forEach((frame, index) => {
            const x = narrow ? width * (0.26 + index * 0.80) : width * frame.x
            const y = narrow ? height * (index % 2 ? 0.63 : 0.48) : height * frame.y
            place(prints[index], x, y, width * (narrow ? 0.62 : frame.width), height * 0.35)
          })
          if (narrow) {
            for (let index = 4; index < prints.length; index++) {
              const slot = index - 4, column = slot % 3, row = Math.floor(slot / 3)
              const p = prints[index], desired = width * (p.ratio < 1 ? 0.22 : 0.28)
              place(p, width * ((column + 0.5) / 3) - desired / 2,
                height * (0.26 + row * 0.21), desired, height * 0.185)
            }
          } else {
            galleryRows.forEach((row, rowIndex) => {
              const total = row.widths.reduce((sum, w) => sum + w, 0) + row.gap * (row.frames.length - 1)
              let cursor = width * (1 - total) / 2
              row.frames.forEach((index, slot) => {
                const jitter = [0.015, -0.015, 0.02, -0.025, 0][slot]
                place(prints[index], cursor, height * (row.center + jitter), width * row.widths[slot], height * (width / height > 2 ? 0.26 : 0.32))
                cursor += width * (row.widths[slot] + row.gap)
              })
            })
          }
          openingSpan = width * 0.3656
          holdEnd = width * 0.7312
          const firstFramesEdge = Math.max(...prints.slice(0, 4).map(p => p.x + p.width))
          const typeClearPan = holdEnd + width * trailBlend / 2
            + (headlineWidth * 0.84 + width * 0.16) / trailingRate
          worldsStart = Math.max(firstFramesEdge + width * 0.3, typeClearPan)
          worldsScale = Math.min(1, width * 0.88 / worldsWidth)
          worldsCenter = (width - worldsWidth * worldsScale) / 2
          releaseStart = worldsStart + width * 3.4
          travel = releaseStart + width * 1.6
          contactX = width * (narrow ? 1.68 : 1.83)
          scene.style.setProperty('--contact-x', `${contactX}px`)
          document.querySelector('[data-worlds-link]').dataset.go = String((worldsStart + width * 2.8) / travel)
          updateNavigation()
          wake()
        }
        // Background swipes pan the wall; touching a print keeps its pendulum interaction.
        let swipe = null
        scene.addEventListener('pointerdown', e => {
          if (e.button !== 0 || e.target.closest('button')) return
          swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, target }
          scene.setPointerCapture(e.pointerId)
        })
        scene.addEventListener('pointermove', e => {
          if (swipe?.id !== e.pointerId) return
          const dx = swipe.x - e.clientX, dy = swipe.y - e.clientY
          setProgress(swipe.target + (Math.abs(dx) > Math.abs(dy) ? dx : dy) / travel)
        })
        const endSwipe = () => { swipe = null }
        scene.addEventListener('pointerup', endSwipe)
        scene.addEventListener('pointercancel', endSwipe)
        scene.addEventListener('lostpointercapture', endSwipe)
        scene.style.touchAction = 'none'
        scene.addEventListener('keydown', e => {
          if (e.altKey || e.ctrlKey || e.metaKey) return
          const steps = { ArrowRight: 0.12, ArrowDown: 0.12, ArrowLeft: -0.12, ArrowUp: -0.12 }
          if (e.key in steps || e.key === 'Home' || e.key === 'End') {
            e.preventDefault()
            setProgress(e.key === 'Home' ? 0 : e.key === 'End' ? 1 : target + steps[e.key] * width * 3 / travel)
          }
        })
        new ResizeObserver(layout).observe(scene)
        new IntersectionObserver((entries) => {
          visible = entries[0].isIntersecting
          if (visible) wake()
          else {
            cancelAnimationFrame(raf)
            raf = 0
          }
        }).observe(scene)
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(raf)
            raf = 0
          } else wake()
        })
        reduced.addEventListener('change', wake)
        addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && parent !== window)
            parent.postMessage({ type: 'component-escape' }, location.origin)
        })
        layout()
        paint()
      })()
    </script>
  </body>
</html>
