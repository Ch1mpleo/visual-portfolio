<!doctype html>
<!-- Emulsion: an independent interaction study by Ch1mpleo.
     No dependencies. Unsplash demo photos require an internet connection. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emulsion — a wall of unhurried moments</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --wall: #eee7da;
        --ink: #29251f;
        --muted: #71695e;
        --red: #c84e30;
      }
      body {
        margin: 0;
        background: var(--wall);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 5px;
      }
      .scene {
        position: relative;
        height: 100svh;
        min-height: 300px;
        overflow: hidden;
        isolation: isolate;
      }
      .scene:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        opacity: 0.1;
        filter: grayscale(1);
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23808080' filter='url(%23n)' d='M0 0h150v150H0z'/%3E%3C/svg%3E");
      }
      .topbar {
        position: absolute;
        inset: 22px 26px auto;
        z-index: 9;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        font: 9px/1.4 monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .topbar button {
        background: none;
        border: 0;
        color: inherit;
        padding: 6px;
        font: inherit;
      }
      .topbar nav {
        display: flex;
        gap: 16px;
      }
      .topbar button[aria-current='true'] {
        text-decoration: underline;
        text-underline-offset: 5px;
      }
      .headline {
        position: absolute;
        left: -36%;
        top: 46%;
        margin: 0;
        color: var(--red);
        font:
          400 clamp(170px, 43vw, 700px) / 0.8 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.075em;
        white-space: nowrap;
        pointer-events: none;
      }
      .intro {
        position: absolute;
        top: 25%;
        left: 8%;
        width: 30%;
        z-index: 2;
      }
      .eyebrow {
        font: 8px/1.6 monospace;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .intro h1 {
        font-weight: 400;
        font-size: clamp(17px, 2.6vw, 42px);
        line-height: 1.08;
        margin: 0;
        letter-spacing: -0.025em;
      }
      .intro hr {
        border: 0;
        border-top: 1px solid var(--muted);
        width: 75%;
        margin: 15px 0;
      }
      .print {
        position: absolute;
        top: var(--y);
        left: var(--x);
        width: var(--w);
        aspect-ratio: 0.74;
        padding: clamp(5px, 0.7vw, 12px);
        padding-bottom: clamp(14px, 2vw, 28px);
        border: 0;
        background: #faf5e8;
        box-shadow: 3px 8px 14px #2f291b2d;
        transform: rotate(var(--angle));
        transform-origin: var(--pin) 4%;
        touch-action: pan-y;
        cursor: grab;
        user-select: none;
        z-index: 3;
      }
      .print:before {
        content: '';
        position: absolute;
        top: 3px;
        left: var(--pin);
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 20%,
          #fff,
          #787568 50%,
          #302e29
        );
        z-index: 1;
        box-shadow: 1px 2px 3px #0004;
      }
      .print img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #b6a58f;
        pointer-events: none;
        filter: sepia(0.12) saturate(0.8);
      }
      .print small {
        position: absolute;
        bottom: 3%;
        left: 8%;
        color: #5f594d;
        font: clamp(5px, 0.7vw, 10px) / 1 monospace;
        letter-spacing: 0.1em;
      }
      .print:hover,
      .print:focus-visible {
        box-shadow: 6px 18px 24px #2f291b40;
        z-index: 6;
      }
      .print.dragging {
        cursor: grabbing;
        z-index: 7;
      }
      .statement {
        position: absolute;
        top: 30%;
        left: 120%;
        width: 33%;
        z-index: 2;
      }
      .statement p {
        font-size: clamp(20px, 3vw, 50px);
        line-height: 1.13;
        letter-spacing: -0.035em;
      }
      .contact {
        position: absolute;
        top: 18%;
        left: 246%;
        width: 65%;
        height: 65%;
        background: var(--red);
        color: #f9edda;
        padding: 6%;
        z-index: 4;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .contact h2 {
        font:
          400 clamp(32px, 7vw, 100px) / 0.95 Georgia,
          serif;
        letter-spacing: -0.05em;
        margin: 0;
      }
      .contact p {
        font: 10px/1.6 monospace;
        max-width: 35ch;
      }
      .contact button {
        align-self: flex-start;
        background: none;
        border: 0;
        border-bottom: 1px solid currentColor;
        padding: 8px 0;
        color: inherit;
        font: 10px monospace;
      }
      .controls {
        position: absolute;
        bottom: 20px;
        left: 26px;
        right: 26px;
        z-index: 9;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .controls button {
        background: none;
        border: 1px solid var(--muted);
        color: inherit;
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        border-radius: 50%;
        font: 14px monospace;
      }
      .controls input {
        appearance: none;
        flex: 1;
        width: 100%;
        height: 24px;
        background: transparent;
        cursor: ew-resize;
        accent-color: var(--red);
        min-width: 0;
      }
      .controls input::-webkit-slider-runnable-track {
        height: 1px;
        background: var(--muted);
      }
      .controls input::-webkit-slider-thumb {
        appearance: none;
        height: 9px;
        width: 9px;
        margin-top: -4px;
        border-radius: 50%;
        background: var(--red);
      }
      .controls input::-moz-range-track {
        height: 1px;
        background: var(--muted);
      }
      .controls input::-moz-range-thumb {
        height: 9px;
        width: 9px;
        border: 0;
        background: var(--red);
      }
      .controls label {
        font: 8px/1.4 monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        max-width: 15ch;
        flex-shrink: 0;
      }
      .credits {
        position: absolute;
        bottom: 60px;
        right: 26px;
        z-index: 9;
        font: 8px monospace;
        color: var(--muted);
        text-underline-offset: 3px;
      }
      @media (max-aspect-ratio: 4/5) {
        .topbar {
          inset: 20px 18px auto;
        }
        .topbar nav {
          gap: 6px;
        }
        .topbar button {
          font-size: 8px;
        }
        .intro {
          top: 17%;
          width: 62%;
          left: 8%;
        }
        .intro h1 {
          font-size: 7vw;
        }
        .headline {
          top: 60%;
          font-size: 64vw;
        }
        .print {
          --y: 42% !important;
          width: 31%;
        }
        .print:nth-of-type(2n) {
          --y: 31% !important;
        }
        .statement {
          width: 68%;
          top: 23%;
        }
        .statement p {
          font-size: 8vw;
        }
        .contact {
          width: 80%;
          left: 246%;
          top: 20%;
          height: 60%;
          padding: 8%;
        }
        .contact h2 {
          font-size: 13vw;
        }
        .controls {
          left: 18px;
          right: 18px;
          gap: 10px;
        }
        .credits {
          right: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene" aria-label="Emulsion interactive photography wall">
      <header class="topbar">
        <button data-go="0" aria-current="true">Emulsion / 001</button>
        <nav aria-label="Wall chapters">
          <button data-go="0.36">About</button>
          <button data-go="0.65">Work</button>
          <button data-go="1">Contact</button>
        </nav>
      </header>
      <div class="headline" aria-hidden="true">photographer</div>
      <div class="intro">
        <p class="eyebrow">Notes from the in-between</p>
        <h1>
          A collector of
          <br />
          unhurried light.
        </h1>
        <hr />
      </div>
      <div class="statement">
        <p class="eyebrow">A way of seeing / 002</p>
        <p>
          Some moments ask
          <br />
          for nothing.
          <br />
          Only that you stay.
        </p>
      </div>
      <div class="contact">
        <p>THE LAST FRAME / 003</p>
        <h2>
          Make something
          <br />
          worth keeping.
        </h2>
        <p>A wall of small moments. A place to begin again.</p>
        <button data-go="0">Back to the first frame ↗</button>
      </div>
      <a
        class="credits"
        href="https://unsplash.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Photography: Unsplash ↗
      </a>
      <div class="controls">
        <button class="previous" aria-label="Pan wall left">←</button>
        <label for="wall-position">Explore the wall</label>
        <input
          id="wall-position"
          aria-label="Position along photography wall"
          type="range"
          min="0"
          max="1000"
          value="0"
        />
        <button class="next" aria-label="Pan wall right">→</button>
      </div>
    </main>
    <script>
      ;(() => {
        const scene = document.querySelector('.scene'),
          slider = document.querySelector('input')
        const reduced = matchMedia('(prefers-reduced-motion: reduce)')
        const photoData = [
          [
            'photo-1470252649378-9c29740c9fa8',
            'A quiet landscape at sunrise',
            37,
            43,
            17,
            -8,
          ],
          [
            'photo-1472396961693-142e6e269027',
            'Deer in woodland light',
            59,
            15,
            16,
            5,
          ],
          [
            'photo-1464822759023-fed622ff2c3b',
            'A mountain peak in the clouds',
            82,
            27,
            17,
            9,
          ],
          [
            'photo-1441974231531-c6227db76b6e',
            'Light through a deep green forest',
            111,
            56,
            15,
            -6,
          ],
          [
            'photo-1519681393784-d120267933ba',
            'Stars above a snow-covered mountain',
            152,
            16,
            19,
            6,
          ],
          [
            'photo-1500534623283-312aade485b7',
            'An open landscape at dusk',
            179,
            45,
            17,
            -9,
          ],
          [
            'photo-1470252649378-9c29740c9fa8',
            'The warm glow before morning',
            207,
            20,
            18,
            5,
          ],
          [
            'photo-1441974231531-c6227db76b6e',
            'Afternoon in the trees',
            232,
            52,
            16,
            -4,
          ],
        ]
        const prints = photoData.map(([id, alt, x, y, width, angle], i) => {
          const el = document.createElement('button')
          el.className = 'print'
          el.setAttribute(
            'aria-label',
            `${alt}. Drag to swing, or press Enter to nudge.`,
          )
          el.style.cssText = `--x:${x}%;--y:${y}%;--w:${width}%;--angle:${angle}deg;--pin:${i % 2 ? 42 : 61}%`
          const img = document.createElement('img')
          img.src = `https://images.unsplash.com/${id}?auto=format&fit=crop&w=700&q=80`
          img.alt = alt
          img.draggable = false
          img.loading = i < 3 ? 'eager' : 'lazy'
          img.srcset = [320, 700]
            .map(
              (w) =>
                `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80 ${w}w`,
            )
            .join(', ')
          img.sizes = '(max-aspect-ratio:4/5) 31vw, 20vw'
          const label = document.createElement('small')
          label.textContent = `FRAME ${String(i + 1).padStart(2, '0')} / 35MM`
          el.append(img, label)
          scene.append(el)
          return {
            el,
            x,
            rest: angle,
            angle,
            velocity: 0,
            dragging: false,
            lastY: 0,
            lastTime: 0,
          }
        })
        const headline = document.querySelector('.headline'),
          intro = document.querySelector('.intro'),
          statement = document.querySelector('.statement'),
          contact = document.querySelector('.contact')
        let progress = 0,
          target = 0,
          raf = 0,
          lastTime = 0,
          visible = true,
          width = scene.clientWidth
        const clamp = (n, min, max) => Math.max(min, Math.min(max, n))
        function canRun() {
          return visible && !document.hidden
        }
        function wake() {
          if (!raf && canRun()) {
            lastTime = 0
            raf = requestAnimationFrame(tick)
          }
        }
        function setProgress(value) {
          target = clamp(value, 0, 1)
          slider.value = String(Math.round(target * 1000))
          if (reduced.matches) progress = target
          wake()
        }
        function paint() {
          const pan = progress * width * 2.285
          intro.style.transform = `translate3d(${-pan}px,0,0)`
          statement.style.transform = `translate3d(${-pan}px,0,0)`
          contact.style.transform = `translate3d(${-pan}px,0,0)`
          // The headline moves against the opening pan, holds, then trails the prints.
          const opening = Math.min(progress / 0.16, 1),
            travel = Math.max(progress - 0.32, 0)
          headline.style.transform = `translate3d(${opening * width * 0.28 - travel * width * 2}px,${-opening * width * 0.035}px,0) scale(${1 - opening * 0.16})`
          prints.forEach((p) => {
            p.el.style.transform = `translate3d(${-pan}px,0,0) rotate(${p.angle}deg)`
            const screenX = (p.x / 100) * width - pan,
              onScreen = screenX > -width * 0.4 && screenX < width * 1.1
            p.el.inert = !onScreen
            p.el.setAttribute('aria-hidden', String(!onScreen))
          })
          const contactVisible = progress > 0.7
          contact.inert = !contactVisible
          document
            .querySelectorAll('.topbar [data-go]')
            .forEach((el) =>
              el.setAttribute(
                'aria-current',
                String(Math.abs(target - Number(el.dataset.go)) < 0.08),
              ),
            )
        }
        function tick(time) {
          raf = 0
          if (!canRun()) return
          const dt = lastTime
            ? Math.min((time - lastTime) / 1000, 0.032)
            : 1 / 60
          lastTime = time
          progress = reduced.matches
            ? target
            : progress + (target - progress) * (1 - Math.exp(-12 * dt))
          let moving = Math.abs(target - progress) > 0.00015
          if (!moving) progress = target
          prints.forEach((p) => {
            if (p.dragging) return
            if (reduced.matches) {
              p.angle = p.rest
              p.velocity = 0
              return
            }
            // A damped pendulum. Integrate twice to keep releases stable at low frame rates.
            for (let i = 0; i < 2; i++) {
              p.velocity +=
                (((-55 * Math.sin(((p.angle - p.rest) * Math.PI) / 180) * 180) /
                  Math.PI -
                  7.5 * p.velocity) *
                  dt) /
                2
              p.angle += (p.velocity * dt) / 2
            }
            if (
              Math.abs(p.angle - p.rest) > 0.015 ||
              Math.abs(p.velocity) > 0.04
            )
              moving = true
            else {
              p.angle = p.rest
              p.velocity = 0
            }
          })
          paint()
          if (moving) raf = requestAnimationFrame(tick)
        }
        prints.forEach((p) => {
          p.el.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || reduced.matches) return
            p.dragging = true
            p.lastY = e.clientY
            p.lastTime = e.timeStamp
            p.velocity = 0
            p.el.classList.add('dragging')
            p.el.setPointerCapture(e.pointerId)
          })
          p.el.addEventListener('pointermove', (e) => {
            if (!p.dragging) return
            const delta = (e.clientY - p.lastY) * 0.45,
              elapsed = Math.max((e.timeStamp - p.lastTime) / 1000, 0.008)
            p.angle = clamp(p.angle + delta, p.rest - 32, p.rest + 32)
            p.velocity = clamp(delta / elapsed, -250, 250)
            p.lastY = e.clientY
            p.lastTime = e.timeStamp
            wake()
          })
          const release = (e) => {
            if (!p.dragging) return
            p.dragging = false
            p.el.classList.remove('dragging')
            if (e.timeStamp - p.lastTime > 100) p.velocity = 0
            wake()
          }
          p.el.addEventListener('pointerup', release)
          p.el.addEventListener('pointercancel', release)
          p.el.addEventListener('lostpointercapture', release)
          p.el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault()
              if (!reduced.matches) {
                p.velocity = 85
                wake()
              }
            }
          })
        })
        slider.addEventListener('input', () =>
          setProgress(Number(slider.value) / 1000),
        )
        document
          .querySelector('.previous')
          .addEventListener('click', () => setProgress(target - 0.16))
        document
          .querySelector('.next')
          .addEventListener('click', () => setProgress(target + 0.16))
        document
          .querySelectorAll('[data-go]')
          .forEach((el) =>
            el.addEventListener('click', () =>
              setProgress(Number(el.dataset.go)),
            ),
          )
        scene.addEventListener(
          'wheel',
          (e) => {
            const delta =
              Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
            if ((target <= 0 && delta < 0) || (target >= 1 && delta > 0)) return
            e.preventDefault()
            const pixels =
              delta *
              (e.deltaMode === 1
                ? 16
                : e.deltaMode === 2
                  ? scene.clientHeight
                  : 1)
            setProgress(target + pixels / (width * 2.285))
          },
          { passive: false },
        )
        new ResizeObserver(() => {
          width = scene.clientWidth
          wake()
        }).observe(scene)
        new IntersectionObserver((entries) => {
          visible = entries[0].isIntersecting
          if (visible) wake()
          else {
            cancelAnimationFrame(raf)
            raf = 0
          }
        }).observe(scene)
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(raf)
            raf = 0
          } else wake()
        })
        reduced.addEventListener('change', wake)
        addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && parent !== window)
            parent.postMessage({ type: 'component-escape' }, location.origin)
        })
        paint()
      })()
    </script>
  </body>
</html>
