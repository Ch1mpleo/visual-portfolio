      .rv-world { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
      .rv-world::after { content: ''; position: absolute; inset: -100vmax; z-index: 100; background: #181422; opacity: var(--shade, 0); transform: translateZ(1px); pointer-events: none; }
      .rv-card { position: absolute; left: 50%; top: 50%; width: var(--card-w); height: var(--card-h); margin: calc(var(--card-h) / -2) 0 0 calc(var(--card-w) / -2); padding: 0; border: 0; border-radius: 8px; background: transparent; cursor: pointer; backface-visibility: hidden; transform-style: preserve-3d; will-change: transform, opacity; }
      .card-face { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; background: #b8aa96; box-shadow: 0 6px 20px -14px #0009, inset 0 0 0 1px #fff1; transition: box-shadow .45s cubic-bezier(.22,.65,.22,1); pointer-events: auto; }
      .rv-media { position: absolute; inset: 0; overflow: hidden; }
      .rv-media img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
      .is-portrait .rv-media img { position: absolute; left: 50%; top: 50%; width: var(--media-h); height: var(--media-w); transform: translate(-50%, -50%) rotate(-90deg); }
      .rv-card .rv-media { --media-w: var(--card-w); --media-h: var(--card-h); }
      .caption { position: absolute; inset: auto 0 0; padding: 35px 12px 13px; color: #fffaf1; background: linear-gradient(transparent, #17100bd9); opacity: 0; transform: translateY(5px); transition: opacity .38s, transform .5s cubic-bezier(.22,.65,.22,1); text-align: left; pointer-events: none; }
      .caption em { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: italic clamp(11px,.9vw,14px)/1.2 Georgia, serif; }
      .scene[data-explorable='false'] .rv-card { pointer-events: none; }
      .scene[data-explorable='false'] .card-face { pointer-events: none; }
      .scene[data-explorable='true'] .rv-card.is-active { z-index: 140 !important; }
      .scene[data-explorable='true'] .rv-card.is-active .caption { opacity: 1; transform: none; }
      .scene[data-explorable='true'] .rv-card.is-active .card-face { box-shadow: 0 25px 48px -18px #0009, 0 5px 16px #0003; }
      .rv-card.is-inspected .card-face { visibility: hidden; }
      .hero { position: absolute; inset: 0; z-index: 15; overflow: hidden; background: #74624d; pointer-events: none; will-change: transform, clip-path, opacity; }
      .hero img { height: 100%; width: 100%; display: block; object-fit: cover; }
      .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, #140d0860); }
      .poem { position: absolute; left: 6%; right: 6%; bottom: 13%; z-index: 17; color: #fff8ec; pointer-events: none; text-shadow: 0 1px 12px #0008; }

      .title-group { position: absolute; left: 50%; top: 50%; width: 85%; transform: translate(-50%,-50%); text-align: center; z-index: 4; pointer-events: none; }

      .title-group em { display: block; margin-top: 15px; font: italic clamp(16px,1.8vw,27px)/1.2 Georgia,serif; color: #83786c; }
      .scene-foot { position: absolute; left: 30px; right: 30px; bottom: 18px; z-index: 25; display: flex; align-items: center; justify-content: space-between; gap: 18px; color: var(--chrome, #f7f1e8); font: 9px/1.4 monospace; letter-spacing: .07em; }
      .scene-foot p { margin: 0; }
      .photo-dialog { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; overflow: auto; background: transparent; color: var(--ink); }

      .photo-scrim { position: fixed; inset: 0; z-index: 0; background: #eee6d6c4; backdrop-filter: blur(9px); pointer-events: none; }
      .detail-panel { position: relative; z-index: 1; width: 100%; min-height: 100%; padding: 65px 20px 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; pointer-events: none; }
      .detail-frame { position: relative; flex: 0 0 auto; width: min(86vw, calc(64svh * var(--ratio, 1.777778)), 1100px); aspect-ratio: var(--ratio, 1.777778); overflow: hidden; border-radius: 10px; background: #b4a58e; box-shadow: 0 14px 40px -22px #0007; pointer-events: auto; }

      .detail-copy h2 { margin: 0 0 10px; font: italic clamp(21px,2vw,32px)/1.1 Georgia,serif; }
      .detail-actions { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }

      .detail-actions button:hover, .detail-close:hover { opacity: .55; }
      .detail-actions svg { width: 26px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.25; }
      .detail-close { position: fixed; right: 24px; top: 22px; z-index: 6; font-size: 27px; pointer-events: auto; }
      .photo-flight { position: fixed; z-index: 4; flex: none; margin: 0; max-width: none; aspect-ratio: auto; pointer-events: none; transform-origin: center; will-change: transform, clip-path; }
      .scene[data-explorable='true'] .topbar p,

      @media (max-width: 600px) {

        .scene-foot { left: 18px; right: 18px; bottom: 13px; font-size: 8px; }

        .title-group em { max-width: 24ch; margin: 12px auto 0; }

        .detail-close { right: 15px; top: 15px; }

          e.preventDefault()

          setProgress(target+delta*(e.deltaMode===1?16:e.deltaMode===2?height:1)/scrollSpan)
        },{passive:false})
        scene.addEventListener('pointerdown',e=>{
          if(e.button!==0 || !e.isPrimary || e.target.closest('.topbar'))return
          suppressClick=false
          if(e.pointerType!=='mouse'){pointerDriven=false;setHover(null);swipe={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,progress:target,gallery:progress>=4.8}}
        })
        scene.addEventListener('pointermove',e=>{
          if(swipe?.id===e.pointerId){
            swipe.dx=e.clientX-swipe.x;swipe.dy=e.clientY-swipe.y
            if(Math.hypot(swipe.dx,swipe.dy)>10){
              suppressClick=true;scene.setPointerCapture(e.pointerId)
              if(!swipe.gallery)setProgress(swipe.progress-(Math.abs(swipe.dy)>Math.abs(swipe.dx)?swipe.dy:swipe.dx)/scrollSpan)
            }
          }else if(e.pointerType==='mouse'&&progress>=4.8&&!dialog.open){
            if(e.target.closest('.topbar')){pointerDriven=false;setHover(null);return}
            pointerDriven=true;mouseX=e.clientX;mouseY=e.clientY
            // Absolute targets and a quiet centre keep the finite field from drifting.
            const reach=n=>{n=clamp(n,-1,1);return Math.sign(n)*smooth((Math.abs(n)-.18)/.82)}
            targetPanX=-reach(e.clientX/width*2-1)*limitX
            targetPanY=-reach(e.clientY/height*2-1)*limitY
            if(reduced.matches){panX=targetPanX;panY=targetPanY;paint()}
            wake()
          }
        })
        const endSwipe=e=>{
          if(swipe?.id!==e.pointerId)return
          const gesture=swipe;swipe=null
          if(e.type==='pointerup'&&gesture.gallery&&Math.hypot(gesture.dx,gesture.dy)>32){
            setHover(null)
            if(Math.abs(gesture.dx)>Math.abs(gesture.dy))targetPanX=clamp(targetPanX+Math.sign(gesture.dx)*width*.65,-limitX,limitX)
            else targetPanY=clamp(targetPanY+Math.sign(gesture.dy)*height*.65,-limitY,limitY)
            if(reduced.matches){panX=targetPanX;panY=targetPanY;paint()}wake()
          }
        }
        scene.addEventListener('pointerup',endSwipe);scene.addEventListener('pointercancel',endSwipe)
        scene.addEventListener('lostpointercapture',e=>{if(e.target===scene)endSwipe(e)})
        scene.addEventListener('pointerleave',()=>{if(!swipe){pointerDriven=false;setHover(null)}})
        scene.addEventListener('click',e=>{if(pointerDriven&&!e.target.closest('button'))openFromInput(e)})
        scene.addEventListener('keydown',e=>{
          if(e.altKey||e.ctrlKey||e.metaKey)return
          pointerDriven=false
          const card=e.target.closest('.rv-card')
          const directions={ArrowRight:1,ArrowLeft:-1,ArrowDown:columns,ArrowUp:-columns}
          if(card && e.key in directions && progress>=4.8){
            e.preventDefault();e.stopPropagation();focusIndex=clamp(cards.findIndex(c=>c.el===card)+directions[e.key],0,cards.length-1)
            cards.forEach((c,i)=>{c.el.tabIndex=i===focusIndex?0:-1})
            const pose=cards[focusIndex].poses[5];targetPanX=clamp(-pose.x,-limitX,limitX);targetPanY=clamp(-pose.y,-limitY,limitY)
            cards[focusIndex].el.focus({preventScroll:true});if(reduced.matches){panX=targetPanX;panY=targetPanY;paint()}wake();return
          }
          if(e.key==='Home'||e.key==='End'||e.key==='PageDown'||e.key==='PageUp'||(!e.target.closest('button')&&e.key in directions)){
            e.preventDefault();setProgress(e.key==='Home'?0:e.key==='End'?5:e.key==='PageDown'?target+1:e.key==='PageUp'?target-1:target+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-.18:.18))
          }
        })
        document.addEventListener('keydown',e=>{
          if(e.key==='Escape'){
            if(dialog.open){e.preventDefault();e.stopImmediatePropagation();closePhoto()}
            else if(parent!==window){e.preventDefault();parent.postMessage({type:'component-escape'},location.origin)}
          }else if(dialog.open&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();changePhoto(e.key==='ArrowRight'?1:-1)}
        },true)
        reduced.addEventListener('change',()=>{
          if(dialog.open)settlePhoto()
          progress=target;introAge=1;panX=targetPanX;panY=targetPanY
          advanceHover(1);paint();wake()
        })
        new ResizeObserver(layout).observe(scene)
        new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible)wake();else{cancelAnimationFrame(raf);raf=0}}).observe(scene)
        document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()})
        layout()
      })()
    </script>
  </body>
</html>
